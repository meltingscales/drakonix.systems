[package]
name = "rust-blog"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "trace"] }

# Templating
tera = "1"

# Markdown processing
pulldown-cmark = { version = "0.11", default-features = false, features = ["html"] }
html-escape = "0.2"

# Frontmatter & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Syntax highlighting
syntect = "5"

# RSS feed generation
rss = "2"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File watching (for dev mode)
notify = "6"

# Regex for parsing
regex = "1"

# Async utilities
futures = "0.3"

# UUID generation for timers
uuid = { version = "1", features = ["v4", "serde"] }

# Random number generation for markov chains
rand = "0.8"

# Favicon generation
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"

# Environment variables
dotenvy = "0.15"

# OpenAPI / Swagger documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# HTTP client for monitor utility
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

# TUI for monitor utility
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
