server {
    listen 443 ssl;
    server_name drakonix.systems;

    ssl_certificate /etc/letsencrypt/live/drakonix.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drakonix.systems/privkey.pem;

    # Map backend port based on dragonrouter route
    map $route_backend $backend_port {
        default 3000;
        ~*dragonrouter/donationaggregator* 3003;
        ~*dragonrouter/carethermometer* 3002;
        ~*dragonrouter/meowderall* 3001;
    }

    # Static files - route to correct backend based on route
    location /static/ {
        proxy_pass http://127.0.0.1:$route_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # favicon
    location = /favicon.ico {
        return 204;
    }

    # dragonrouter routes (must be BEFORE / to avoid catching)
    location /dragonrouter/donationaggregator/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dragonrouter/carethermometer/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dragonrouter/meowderall/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # main rust site, /drakonix.systems/
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name drakonix.systems;
    return 301 https://$host$request_uri;
}
