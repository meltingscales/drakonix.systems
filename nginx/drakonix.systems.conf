server {
    listen 443 ssl;
    server_name drakonix.systems;

    ssl_certificate /etc/letsencrypt/live/drakonix.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drakonix.systems/privkey.pem;

    # Static files - route to correct backend based on referer
    location /static/ {
        if ($http_referer ~*dragonrouter/donationaggregator*) {
            proxy_pass http://127.0.0.1:3003;
        }
        if ($http_referer ~*dragonrouter/carethermometer*) {
            proxy_pass http://127.0.0.1:3002;
        }
        if ($http_referer ~*dragonrouter/meowderall*) {
            proxy_pass http://127.0.0.1:3001;
        }
        # Default to main site
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # favicon
    location = /favicon.ico {
        return 204;
    }

    # dragonrouter routes (must be BEFORE / to avoid catching)
    location /dragonrouter/donationaggregator/ {
        proxy_pass http://127.0.0.1:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dragonrouter/carethermometer/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dragonrouter/meowderall/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # main rust site, /drakonix.systems/
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name drakonix.systems;
    return 301 https://$host$request_uri;
}
