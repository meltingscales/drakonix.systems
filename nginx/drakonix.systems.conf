log_format ip_log '$remote_addr "$http_x_forwarded_for" [$time_local] "$request" $status';

# Main site - drakonix.systems
server {
    listen 443 ssl;
    server_name drakonix.systems;

    ssl_certificate /etc/letsencrypt/live/drakonix.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drakonix.systems/privkey.pem;

    access_log /var/log/nginx/drakonix.systems.access.log ip_log;

    # Static files
    location /static/ {
        alias /home/henrypost/Git/drakonix.systems/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

