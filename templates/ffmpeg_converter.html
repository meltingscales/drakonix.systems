{% extends "base.html" %} {% block content %}
<div class="converter-container">
    <h1>MP4 to MP3 Converter</h1>
    <p>Convert your MP4 video files to MP3 audio files using FFmpeg.</p>
    <p>This was made just to demonstrate a simple FFmpeg handler.</p>

    <div class="upload-section">
        <div class="file-input-wrapper">
            <input type="file" id="file-input" accept="video/mp4,.mp4" />
            <label for="file-input" class="file-label">
                <span id="file-label-text">Choose MP4 file or drag here</span>
            </label>
        </div>

        <div id="file-info" class="file-info" style="display: none">
            <p><strong>File:</strong> <span id="filename"></span></p>
            <p><strong>Size:</strong> <span id="filesize"></span></p>
        </div>

        <div class="conversion-options">
            <h3>Audio Quality</h3>
            <div class="quality-options">
                <label>
                    <input type="radio" name="quality" value="320" checked />
                    320 kbps (High Quality)
                </label>
                <label>
                    <input type="radio" name="quality" value="192" />
                    192 kbps (Standard)
                </label>
                <label>
                    <input type="radio" name="quality" value="128" />
                    128 kbps (Lower Size)
                </label>
            </div>
        </div>

        <button id="convert-btn" class="btn btn-primary" disabled>
            Convert to MP3
        </button>

        <div id="progress-section" style="display: none">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="status-text">Processing...</p>
        </div>

        <div id="download-section" style="display: none">
            <p class="success-message">Conversion complete!</p>
            <a id="download-link" class="btn btn-success" download>
                Download MP3
            </a>
        </div>

        <div id="error-section" style="display: none">
            <p class="error-message" id="error-text"></p>
        </div>
    </div>
</div>

<style>
    .converter-container {
        max-width: 700px;
        margin: 0 auto;
        padding: 2rem;
    }

    .upload-section {
        margin-top: 2rem;
    }

    .file-input-wrapper {
        position: relative;
        margin: 2rem 0;
    }

    #file-input {
        display: none;
    }

    .file-label {
        display: block;
        padding: 3rem;
        border: 2px dashed #ddd;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        background: #f8f9fa;
        transition: all 0.3s ease;
    }

    .file-label:hover {
        border-color: #007bff;
        background: #e7f3ff;
    }

    .file-label.dragover {
        border-color: #007bff;
        background: #e7f3ff;
        border-style: solid;
    }

    #file-label-text {
        font-size: 1.1rem;
        color: #666;
    }

    .file-info {
        background: #f5f5f5;
        padding: 1rem;
        border-radius: 5px;
        margin: 1rem 0;
    }

    .file-info p {
        margin: 0.5rem 0;
    }

    .conversion-options {
        margin: 2rem 0;
    }

    .conversion-options h3 {
        margin-bottom: 1rem;
        font-size: 1.1rem;
    }

    .quality-options {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    .quality-options label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 3px;
    }

    .quality-options label:hover {
        background: #f5f5f5;
    }

    .quality-options input[type="radio"] {
        cursor: pointer;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background: #007bff;
        color: white;
    }

    .btn-primary:hover:not(:disabled) {
        background: #0056b3;
    }

    .btn-primary:disabled {
        background: #6c757d;
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-success {
        background: #28a745;
        color: white;
    }

    .btn-success:hover {
        background: #1e7e34;
    }

    #progress-section {
        margin-top: 2rem;
    }

    .progress-bar {
        width: 100%;
        height: 30px;
        background: #f0f0f0;
        border-radius: 15px;
        overflow: hidden;
        margin-bottom: 1rem;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #007bff, #0056b3);
        width: 0%;
        transition: width 0.3s ease;
    }

    #status-text {
        text-align: center;
        color: #666;
        font-weight: 600;
    }

    .success-message {
        color: #28a745;
        font-weight: 600;
        font-size: 1.2rem;
        margin-bottom: 1rem;
    }

    .error-message {
        color: #dc3545;
        font-weight: 600;
        padding: 1rem;
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        border-radius: 5px;
    }

    #download-section {
        margin-top: 2rem;
        text-align: center;
    }
</style>

<script>
    const fileInput = document.getElementById("file-input");
    const fileLabel = document.querySelector(".file-label");
    const fileLabelText = document.getElementById("file-label-text");
    const fileInfo = document.getElementById("file-info");
    const filename = document.getElementById("filename");
    const filesize = document.getElementById("filesize");
    const convertBtn = document.getElementById("convert-btn");
    const progressSection = document.getElementById("progress-section");
    const progressFill = document.getElementById("progress-fill");
    const statusText = document.getElementById("status-text");
    const downloadSection = document.getElementById("download-section");
    const downloadLink = document.getElementById("download-link");
    const errorSection = document.getElementById("error-section");
    const errorText = document.getElementById("error-text");

    let selectedFile = null;

    // File selection
    fileInput.addEventListener("change", (e) => {
        handleFileSelect(e.target.files[0]);
    });

    // Drag and drop
    fileLabel.addEventListener("dragover", (e) => {
        e.preventDefault();
        fileLabel.classList.add("dragover");
    });

    fileLabel.addEventListener("dragleave", () => {
        fileLabel.classList.remove("dragover");
    });

    fileLabel.addEventListener("drop", (e) => {
        e.preventDefault();
        fileLabel.classList.remove("dragover");

        const file = e.dataTransfer.files[0];
        if (file && file.type === "video/mp4") {
            handleFileSelect(file);
        } else {
            showError("Please select a valid MP4 file");
        }
    });

    function handleFileSelect(file) {
        if (!file) return;

        if (!file.type.includes("mp4") && !file.name.endsWith(".mp4")) {
            showError("Please select a valid MP4 file");
            return;
        }

        selectedFile = file;
        filename.textContent = file.name;
        filesize.textContent = formatFileSize(file.size);
        fileInfo.style.display = "block";
        convertBtn.disabled = false;
        fileLabelText.textContent = "File selected - Choose another or convert";

        // Hide previous results
        downloadSection.style.display = "none";
        errorSection.style.display = "none";
        progressSection.style.display = "none";
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    function showError(message) {
        errorText.textContent = message;
        errorSection.style.display = "block";
        setTimeout(() => {
            errorSection.style.display = "none";
        }, 5000);
    }

    // Convert button
    convertBtn.addEventListener("click", async () => {
        if (!selectedFile) return;

        const quality = document.querySelector(
            'input[name="quality"]:checked',
        ).value;

        // Hide previous results
        downloadSection.style.display = "none";
        errorSection.style.display = "none";

        // Show progress
        progressSection.style.display = "block";
        progressFill.style.width = "0%";
        statusText.textContent = "Uploading...";
        convertBtn.disabled = true;

        try {
            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("bitrate", quality);

            // Upload with progress
            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener("progress", (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 50; // Upload is 50% of progress
                    progressFill.style.width = percentComplete + "%";
                    statusText.textContent = `Uploading... ${Math.round(percentComplete)}%`;
                }
            });

            xhr.addEventListener("load", async () => {
                if (xhr.status === 200) {
                    progressFill.style.width = "50%";
                    statusText.textContent = "Converting...";

                    // Simulate conversion progress
                    let progress = 50;
                    const progressInterval = setInterval(() => {
                        progress += 5;
                        if (progress >= 95) {
                            clearInterval(progressInterval);
                        }
                        progressFill.style.width = progress + "%";
                    }, 200);

                    const response = JSON.parse(xhr.responseText);

                    clearInterval(progressInterval);
                    progressFill.style.width = "100%";
                    statusText.textContent = "Complete!";

                    // Set up download
                    const mp3Filename =
                        selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp3";
                    downloadLink.href = `/api/convert/download/${response.file_id}`;
                    downloadLink.download = mp3Filename;

                    setTimeout(() => {
                        progressSection.style.display = "none";
                        downloadSection.style.display = "block";
                    }, 500);
                } else {
                    const error = JSON.parse(xhr.responseText);
                    throw new Error(error.error || "Conversion failed");
                }
            });

            xhr.addEventListener("error", () => {
                throw new Error("Network error occurred");
            });

            xhr.open("POST", "/api/convert/mp4-to-mp3");
            xhr.send(formData);
        } catch (error) {
            console.error("Conversion error:", error);
            showError(error.message || "Conversion failed. Please try again.");
            progressSection.style.display = "none";
            convertBtn.disabled = false;
        }
    });
</script>
{% endblock %}
