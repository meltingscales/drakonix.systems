{% extends "base.html" %}

{% block title %}{{ post.title }} - Rust Blog{% endblock %}

{% block content %}
<article class="post">
    <header class="post-header">
        <h1>{{ post.title }}</h1>
        <div class="post-meta">
            <time datetime="{{ post.date }}">{{ post.date | date(format="%B %d, %Y") }}</time>
            {% if post.tags %}
            <div class="tags">
                {% for tag in post.tags %}
                <span class="tag">{{ tag }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </header>

    <div class="post-content">
        {{ post.html | safe }}
    </div>
</article>
{% endblock %}
