{% extends "base.html" %}

{% block content %}
<h1>All Posts</h1>

{% if posts %}
    <ul class="posts-list">
        {% for post in posts %}
        <li class="post-item">
            <time datetime="{{ post.date }}">{{ post.date }}</time>
            <a href="{{ post.url }}">{{ post.title }}</a>
            {% if post.tags %}
            <div class="tags">
                {% for tag in post.tags %}
                <span class="tag">{{ tag }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No posts yet.</p>
{% endif %}
{% endblock %}
