{% extends "base.html" %} {% block content %}
<div class="hp-container">
    <h1>Honeypot Dummies</h1>
    <p class="hp-subtitle" id="hp-subtitle">
        Recent hits to the markov-babble honeypot and catch-all 404 endpoints.
    </p>
    <p class="hp-count" id="hp-count"></p>
    <div class="hp-toolbar">
        <input type="search" id="hp-filter" placeholder="Filter table by IP, slug, country…" />
        <div class="hp-toolbar-right">
            <span id="hp-last-updated"></span>
            <label for="hp-refresh-select">Auto-refresh:</label>
            <select id="hp-refresh-select">
                <option value="0">Off</option>
                <option value="15">15 s</option>
                <option value="30">30 s</option>
                <option value="60">1 min</option>
                <option value="300">5 min</option>
            </select>
        </div>
    </div>
    <div id="hp-root"></div>
</div>

<style>
    .hp-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem;
    }
    .hp-container h1 {
        font-size: 2rem;
        margin-bottom: 0.4rem;
    }
    .hp-subtitle,
    .hp-count {
        color: var(--text-secondary);
        margin-bottom: 1.2rem;
        font-size: 0.95rem;
    }
    .hp-empty {
        color: var(--text-secondary);
        font-style: italic;
        margin-top: 2rem;
    }
    .hp-table-wrap {
        overflow-x: auto;
    }
    .hp-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.88rem;
    }
    .hp-table th,
    .hp-table td {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border-primary);
        text-align: left;
        vertical-align: top;
    }
    .hp-table th {
        background: var(--bg-secondary);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
    }
    .hp-table tbody tr:nth-child(even) {
        background: var(--bg-secondary);
    }
    .hp-table tbody tr:hover {
        background: var(--bg-hover);
    }
    .hp-id {
        font-family: monospace;
        color: var(--text-secondary);
        white-space: nowrap;
    }
    .hp-slug code,
    .hp-ip a code {
        font-size: 0.85rem;
    }
    .hp-ts {
        white-space: nowrap;
        font-size: 0.82rem;
        color: var(--text-secondary);
    }
    .hp-headers details summary {
        cursor: pointer;
        font-size: 0.82rem;
        color: var(--text-secondary);
        user-select: none;
    }
    .hp-headers details summary:hover {
        color: var(--text-primary);
    }
    .hp-json {
        margin: 0.5rem 0 0;
        padding: 0.5rem;
        background: var(--bg-primary);
        border: 1px solid var(--border-primary);
        border-radius: 4px;
        font-size: 0.75rem;
        white-space: pre-wrap;
        word-break: break-all;
        max-width: 420px;
        overflow-x: auto;
    }
    @media (max-width: 640px) {
        .hp-container {
            padding: 1rem;
        }
        .hp-container h1 {
            font-size: 1.5rem;
        }
    }
</style>

<link rel="stylesheet" href="/static/css/honeypot_dummies.css" />
<script src="/static/js/honeypot_dummies.js"></script>
{% endblock %}
